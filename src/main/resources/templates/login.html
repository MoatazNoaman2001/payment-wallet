<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Payment Wallet</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="brand" style="margin-bottom:20px">payment<span>wallet</span></div>

        <h1 class="login-title">Sign in</h1>
        <p class="login-sub">Double-entry ledger demo</p>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus
                       th:value="${email}" placeholder="mona@demo.local">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-block">Sign in</button>
        </form>

        <div class="alert alert-error" th:if="${error}" th:text="${error}">Email or password is incorrect</div>
        <div class="alert alert-ok" th:if="${param.loggedOut}">You have been signed out.</div>

        <div class="alert alert-ok" th:if="${param.registered}">
            Account created. An administrator must activate it before you can transact.
        </div>

        <p class="hint">
            New here? <a th:href="@{/register}">Create an account</a><br>
            <code>mona@demo.local</code> · <code>demo-pass-12345</code><br>
            <code>admin@paymentwallet.local</code> · <code>admin12345</code>
        </p>
    </div>
</div>

</body>
</html>
