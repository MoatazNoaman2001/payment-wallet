<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounts · Payment Wallet</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar('accounts')}"></div>

<div class="wrap">
    <h1 class="page-title" th:text="${staff} ? 'All accounts' : 'Your accounts'">Accounts</h1>
    <p class="page-sub" th:text="${staff}
            ? 'Every account in the system. Balances are a projection of the ledger.'
            : 'Balances are a projection of the ledger, not the source of truth.'">
        Balances are a projection of the ledger, not the source of truth.
    </p>

    <div class="card" th:each="account : ${page.content}">
        <div class="card-row">
            <div class="card-main">
                <a class="acct-number"
                   th:href="@{/accounts/{n}/statement(n=${account.accountNumber})}"
                   th:text="${account.accountNumber}">PW0000000000000000</a>
                <div class="meta">
                    <span class="badge outline" th:text="${account.type}">WALLET</span>
                    <span class="badge"
                          th:classappend="${#strings.toLowerCase(account.status)}"
                          th:text="${account.status}">ACTIVE</span>
                    <span th:if="${staff}" class="owner" th:text="${account.ownerEmail}">someone@example.com</span>
                    <span th:if="${account.dailyLimit != null}"
                          th:text="'limit ' + ${#numbers.formatDecimal(account.dailyLimit, 1, 'COMMA', 2, 'POINT')}">
                        limit 0.00
                    </span>
                </div>
            </div>
            <div class="balance">
                <a class="btn btn-outline btn-sm" style="margin-bottom:8px"
                   th:href="@{/transfer(from=${account.accountNumber})}">Send</a><br>
                <span class="balance-amount"
                      th:text="${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                <span class="balance-ccy" th:text="${account.currencyCode}">EGP</span>
            </div>
        </div>
    </div>

    <div class="empty" th:if="${page.isEmpty()}">
        <span th:if="${staff}">No accounts exist yet.</span>
        <span th:unless="${staff}">You have no accounts yet.</span>
    </div>

    <div class="summary" th:unless="${page.isEmpty()}">
        <span th:text="${page.totalElements} + (${page.totalElements} == 1 ? ' account' : ' accounts')">0 accounts</span>
        <span th:unless="${staff}">total
            <strong th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">0.00</strong></span>
    </div>

    <div class="pagination" th:if="${page.totalPages > 1}">
        <span th:text="'Page ' + (${page.number} + 1) + ' of ' + ${page.totalPages}">Page 1 of 1</span>
        <span class="pages">
            <a class="btn btn-outline btn-sm" th:classappend="${page.first} ? 'disabled'"
               th:href="@{/accounts(page=${page.number - 1}, size=${page.size})}">Previous</a>
            <a class="btn btn-outline btn-sm" th:classappend="${page.last} ? 'disabled'"
               th:href="@{/accounts(page=${page.number + 1}, size=${page.size})}">Next</a>
        </span>
    </div>
</div>

</body>
</html>
