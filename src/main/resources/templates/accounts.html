<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accounts · Payment Wallet</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="wrap">
    <h1>Your accounts</h1>
    <p class="sub">Balances are a projection of the ledger, not the source of truth.</p>

    <!--
      th:each is Blade's @foreach. The markup below is also valid standalone HTML:
      opening this file in a browser shows the placeholder row, which is the point of
      Thymeleaf's "natural templates".
    -->
    <div class="card" th:each="account : ${accounts}">
        <div class="card-row">
            <div>
                <div class="acct-number" th:text="${account.accountNumber}">PW0000000000000000</div>
                <div class="meta">
                    <span th:text="${account.type}">WALLET</span>
                    &nbsp;·&nbsp;
                    <span class="pill"
                          th:classappend="${#strings.toLowerCase(account.status)}"
                          th:text="${account.status}">ACTIVE</span>
                    <span th:if="${account.dailyLimit != null}"
                          th:text="' · daily limit ' + ${#numbers.formatDecimal(account.dailyLimit, 1, 'COMMA', 2, 'POINT')}">
                    </span>
                </div>
            </div>
            <div class="balance">
                <span th:text="${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                <span class="ccy" th:text="${account.currencyCode}">EGP</span>
            </div>
        </div>
    </div>

    <div class="empty" th:if="${accounts.isEmpty()}">
        No accounts yet. Open one through the API or Swagger.
    </div>

    <div class="total" th:unless="${accounts.isEmpty()}">
        <span th:text="${accounts.size()} + ' account(s)'">0 account(s)</span>
        <span th:text="'total ' + ${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">total 0.00</span>
    </div>
</div>

</body>
</html>
