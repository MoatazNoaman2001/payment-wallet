<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounts · Payment Wallet</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar}"></div>

<div class="wrap">
    <h1 class="page-title">Accounts</h1>
    <p class="page-sub">Balances are a projection of the ledger, not the source of truth.</p>

    <div class="card" th:each="account : ${accounts}">
        <div class="card-row">
            <div>
                <a class="acct-number"
                   th:href="@{/accounts/{n}/statement(n=${account.accountNumber})}"
                   th:text="${account.accountNumber}">PW0000000000000000</a>
                <div class="meta">
                    <span class="badge outline" th:text="${account.type}">WALLET</span>
                    <span class="badge"
                          th:classappend="${#strings.toLowerCase(account.status)}"
                          th:text="${account.status}">ACTIVE</span>
                    <span class="dot" th:if="${account.dailyLimit != null}">·</span>
                    <span th:if="${account.dailyLimit != null}"
                          th:text="'daily limit ' + ${#numbers.formatDecimal(account.dailyLimit, 1, 'COMMA', 2, 'POINT')}">
                        daily limit 0.00
                    </span>
                </div>
            </div>
            <div class="balance">
                <span class="balance-amount"
                      th:text="${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                <span class="balance-ccy" th:text="${account.currencyCode}">EGP</span>
            </div>
        </div>
    </div>

    <div class="empty" th:if="${accounts.isEmpty()}">
        No accounts yet. Open one through the API or Swagger.
    </div>

    <div class="summary" th:unless="${accounts.isEmpty()}">
        <span th:text="${accounts.size()} + (${accounts.size()} == 1 ? ' account' : ' accounts')">0 accounts</span>
        <span>total <strong th:text="${#numbers.formatDecimal(total, 1, 'COMMA', 2, 'POINT')}">0.00</strong></span>
    </div>
</div>

</body>
</html>
