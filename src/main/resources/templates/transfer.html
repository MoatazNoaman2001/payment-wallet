<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Send money · Payment Wallet</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar('transfer')}"></div>

<div class="wrap" style="max-width:560px">
    <h1 class="page-title">Send money</h1>
    <p class="page-sub">Both accounts must hold the same currency.</p>

    <div class="empty" th:if="${accounts.isEmpty()}">
        You have no accounts to send from yet.
    </div>

    <form th:unless="${accounts.isEmpty()}" class="card" th:action="@{/transfer}"
          th:object="${form}" method="post" novalidate>

        <input type="hidden" th:field="*{idempotencyKey}">

        <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}" style="margin:0 0 18px">
            <span th:each="e : ${#fields.globalErrors()}" th:text="${e}">rejected</span>
        </div>

        <div class="field">
            <label for="sourceAccountNumber">From</label>
            <select id="sourceAccountNumber" th:field="*{sourceAccountNumber}" class="wide">
                <option th:each="a : ${accounts}" th:value="${a.accountNumber}"
                        th:text="${a.accountNumber} + ' — ' +
                                 ${#numbers.formatDecimal(a.balance, 1, 'COMMA', 2, 'POINT')} + ' ' +
                                 ${a.currencyCode}">PW0000 — 0.00 EGP</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('sourceAccountNumber')}"
               th:errors="*{sourceAccountNumber}">error</p>
        </div>

        <div class="field">
            <label for="destAccountNumber">To</label>
            <input type="text" id="destAccountNumber" th:field="*{destAccountNumber}"
                   placeholder="PW0000000000000000" autocomplete="off">
            <p class="field-error" th:if="${#fields.hasErrors('destAccountNumber')}"
               th:errors="*{destAccountNumber}">error</p>
        </div>

        <div class="field">
            <label for="amount">Amount</label>
            <input type="number" step="0.01" min="0.01" id="amount" th:field="*{amount}"
                   placeholder="0.00">
            <p class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}">error</p>
        </div>

        <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" th:field="*{description}" placeholder="optional">
            <p class="field-error" th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}">error</p>
        </div>

        <button type="submit" class="btn btn-block">Send</button>

        <p class="hint" style="margin-top:18px">
            This form carries a one-time key, so submitting twice — a double click, or
            refreshing the page afterwards — moves the money only once.
        </p>
    </form>
</div>

</body>
</html>
