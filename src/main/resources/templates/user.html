<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${user.fullName} + ' · Payment Wallet'">Customer</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: topbar('users')}"></div>

<div class="wrap">
    <a class="back" th:href="@{/users}" th:if="${staff}">← Customers</a>

    <div class="alert alert-ok" th:if="${param.activated}" style="margin-bottom:16px">User activated.</div>
    <div class="alert alert-ok" th:if="${param.opened}" style="margin-bottom:16px">Account opened.</div>
    <div class="alert alert-error" th:if="${param.frozen}" style="margin-bottom:16px">
        <span class="mono" th:text="${param.frozen}">PW…</span> is frozen. It can neither send nor receive.
    </div>
    <div class="alert alert-ok" th:if="${param.unfrozen}" style="margin-bottom:16px">
        <span class="mono" th:text="${param.unfrozen}">PW…</span> is active again.
    </div>
    <div class="alert alert-error" th:if="${param.error}" th:text="${param.error}" style="margin-bottom:16px">error</div>

    <div class="owner-block">
        <div class="owner-head">
            <div class="avatar" th:text="${#strings.toUpperCase(#strings.substring(user.fullName,0,1))}">M</div>
            <div class="owner-id">
                <div class="owner-name" th:text="${user.fullName}">Mona Ali</div>
                <div class="owner-mail" th:text="${user.email} + ' · ' + ${user.phone}">mona@demo.local</div>
            </div>
            <span class="badge" th:classappend="${user.status.name() == 'ACTIVE'} ? 'active'"
                  th:text="${user.status}">PENDING</span>
        </div>
        <div class="acct-line">
            <span class="muted">Roles</span>
            <span class="acct-tags">
                <span class="badge outline" th:each="r : ${user.roles}" th:text="${r}">ROLE_CUSTOMER</span>
            </span>
            <form th:if="${admin and user.status.name() == 'PENDING'}"
                  th:action="@{/users/{id}/activate(id=${user.publicId})}" method="post" style="margin-left:auto">
                <button type="submit" class="btn btn-sm">Activate</button>
            </form>
        </div>
    </div>

    <h2 class="section-title" style="margin-top:28px">Accounts</h2>

    <div class="owner-accounts boxed" th:unless="${accounts.isEmpty()}">
        <a class="acct-line" th:each="a : ${accounts}"
           th:href="@{/accounts/{n}/statement(n=${a.accountNumber})}">
            <span class="acct-number" th:text="${a.accountNumber}">PW0000000000000000</span>
            <span class="acct-tags">
                <span class="badge outline" th:text="${a.type}">WALLET</span>
                <span class="badge" th:classappend="${#strings.toLowerCase(a.status)}"
                      th:text="${a.status}">ACTIVE</span>
            </span>
            <span class="acct-balance">
                <span th:text="${#numbers.formatDecimal(a.balance, 1, 'COMMA', 2, 'POINT')}">0.00</span>
                <span class="balance-ccy" th:text="${a.currencyCode}">EGP</span>
            </span>
        </a>
        <div class="acct-line" th:if="${staff or canFreeze}" th:each="a : ${accounts}"
             style="justify-content:flex-end;gap:8px;flex-wrap:wrap">
            <span class="muted mono" style="margin-right:auto" th:text="${a.accountNumber}">PW…</span>
            <a class="btn btn-outline btn-sm" th:if="${staff}"
               th:href="@{/cash(account=${a.accountNumber})}">Cash desk</a>
            <form th:if="${canFreeze}" method="post"
                  th:action="@{/users/{id}/accounts/{n}/status(id=${user.publicId}, n=${a.accountNumber})}">
                <input type="hidden" name="action"
                       th:value="${a.status.name() == 'FROZEN'} ? 'unfreeze' : 'freeze'">
                <input type="hidden" name="reason" value="compliance review">
                <button type="submit" class="btn btn-outline btn-sm"
                        th:text="${a.status.name() == 'FROZEN'} ? 'Unfreeze' : 'Freeze'">Freeze</button>
            </form>
        </div>
    </div>

    <div class="empty" th:if="${accounts.isEmpty()}">No accounts yet.</div>

    <form class="filters" style="margin-top:16px"
          th:action="@{/users/{id}/accounts(id=${user.publicId})}" method="post">
        <div class="field">
            <label for="currencyCode">Currency</label>
            <select id="currencyCode" name="currencyCode">
                <option value="EGP">EGP</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
        </div>
        <div class="field">
            <label for="type">Type</label>
            <select id="type" name="type">
                <option th:each="t : ${types}" th:value="${t}" th:text="${t}">WALLET</option>
            </select>
        </div>
        <div class="field">
            <label for="dailyLimit">Daily limit</label>
            <input type="number" step="0.01" id="dailyLimit" name="dailyLimit" placeholder="optional">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-sm">Open account</button>
        </div>
    </form>
</div>

</body>
</html>
