<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${status} + ' · Payment Wallet'">Error</title>
    <link rel="stylesheet" th:href="@{/css/wallet.css}">
</head>
<body>

<div class="login-page">
    <div class="login-card" style="text-align:center">
        <div class="brand" style="margin-bottom:20px">payment<span>wallet</span></div>
        <div class="error-code" th:text="${status} ?: 'Error'">403</div>
        <h1 class="login-title" th:text="${heading} ?: 'Something went wrong'">Not yours</h1>
        <p class="login-sub" th:text="${message} ?: 'Unexpected error.'">You do not have access.</p>
        <a class="btn btn-block" th:href="@{/accounts}" style="margin-top:6px">Back to accounts</a>
    </div>
</div>

</body>
</html>
