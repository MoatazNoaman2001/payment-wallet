<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="topbar (active)" class="topbar">
    <div class="topbar-left">
        <a class="brand" th:href="@{/accounts}">payment<span>wallet</span></a>
        <nav class="nav">
            <a th:href="@{/accounts}" th:classappend="${active == 'accounts'} ? 'on'">Accounts</a>
            <a sec:authorize="isAuthenticated()" th:if="${hasAccounts}" th:href="@{/transfer}"
               th:classappend="${active == 'transfer'} ? 'on'">Send money</a>
            <a sec:authorize="isAuthenticated()" th:if="${hasAccounts}" th:href="@{/funding}"
               th:classappend="${active == 'funding'} ? 'on'">Add money</a>
            <a sec:authorize="isAuthenticated()" th:if="${needsVerification}" th:href="@{/verify}"
               th:classappend="${active == 'verify'} ? 'on'">Verify identity</a>
            <a sec:authorize="hasAnyRole('ADMIN','TELLER')" th:href="@{/cash}"
               th:classappend="${active == 'cash'} ? 'on'">Cash desk</a>
            <a sec:authorize="hasAnyRole('ADMIN','TELLER','SUPERVISOR','COMPLIANCE','AUDITOR','OPS')"
               th:href="@{/users}"
               th:classappend="${active == 'users'} ? 'on'">Customers</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}"
               th:classappend="${active == 'admin'} ? 'on'">Admin</a>
            <a th:href="@{/swagger-ui.html}" target="_blank">API</a>
        </nav>
    </div>
    <div class="topbar-right">
        <span class="who" sec:authorize="isAuthenticated()"
              th:text="${#authentication.principal.claims['email']}">someone@example.com</span>
        <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
            <button type="submit" class="btn btn-ghost">Sign out</button>
        </form>
    </div>
</div>

</body>
</html>
