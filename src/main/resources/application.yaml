spring:
  application:
    name: payment-wallet

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          time_zone: UTC

# API docs: /swagger-ui.html and /v3/api-docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# Auth: see src/main/java/com/moataz/paymentwallet/auth/README.md
security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 14
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Background jobs: outbox publisher and balance reconciliation
reliability:
  scheduling:
    enabled: true
  outbox:
    interval-ms: 5000
  reconciliation:
    interval-ms: 300000

# Observability: requestId comes from CorrelationIdFilter
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId:---------}] %-5level %logger{32} : %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Payment Wallet
    description: Double-entry ledger, idempotent transfers, measured concurrency control

# Counter limits: a teller may hand over only so much without a supervisor
limits:
  teller:
    max-cash: 20000
  # How much may leave an account per day, by verification tier. 0 means no ceiling.
  kyc:
    basic: 5000
    verified: 50000
    enhanced: 0
